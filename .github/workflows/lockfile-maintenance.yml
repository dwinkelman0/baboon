name: Lockfile Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: 7mind/github-env@minimal
        with:
          setup-nix: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh lockfiles (Bazel/Bzlmod)
        run: |
          set -euo pipefail
          # NOTE: `mdl :flake-refresh` was removed with mdl (b1b004f).
          # Bazel/Bzlmod is the primary build now; refresh its lockfile
          # instead. `deps.lock.json` (nix-flake fallback) is no longer
          # refreshed by this job.
          nix develop --command bazel mod tidy

      - name: Commit lockfile update
        id: commit_lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- MODULE.bazel.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Baboon Lockfile Bot"
          git config user.email "lockfile-bot@users.noreply.github.com"
          git add MODULE.bazel.lock
          git commit -m "chore: refresh MODULE.bazel.lock"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit_lockfile.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${TARGET_BRANCH}"
